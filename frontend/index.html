<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Portfolio Risk Engine analytics workspace." />
    <title>Portfolio Risk Engine</title>
    <script>
      // Apply the saved preference before rendering to avoid a theme flash.
      try {
        const preference = localStorage.getItem('riskengine-theme');
        document.documentElement.dataset.theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme =
          matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
