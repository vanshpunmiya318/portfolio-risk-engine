[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-risk-engine"
version = "0.1.0"
description = "Portfolio and market risk intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "yfinance",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "network: tests that call live external services"
]
addopts = "-m 'not network'"